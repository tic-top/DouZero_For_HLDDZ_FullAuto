# DouZero Agent 默认配置文件
# 这个配置系统支持多分辨率、多模板、灵活的参数调整

# 游戏窗口配置
game:
  window_class: "UnityWndClass"
  window_title: "欢乐斗地主"
  target_resolution:
    width: 1440
    height: 810

# 模板图片路径
templates:
  base_path: "pics"  # pics 在项目根目录
  # 卡牌模板前缀
  my_cards: "m"      # 我的手牌
  other_cards: "o"   # 其他玩家的牌
  center_cards: "c"  # 中间区域的牌
  bottom_cards: "z"  # 地主底牌

# 屏幕区域配置（相对坐标，会根据分辨率自动缩放）
regions:
  # 所有坐标格式: [x, y, width, height]
  # 基准分辨率: 1440x810
  base_resolution: [1440, 810]

  my_hand_cards: [180, 560, 1050, 90]
  left_played_cards: [320, 280, 400, 120]
  right_played_cards: [720, 280, 400, 120]
  my_played_cards: [300, 350, 800, 100]
  landlord_cards: [600, 33, 220, 103]

  # 按钮区域
  pass_button: [200, 450, 1000, 120]
  general_button: [200, 450, 1000, 120]
  start_button: [1100, 617, 200, 74]

  # 地主标志位置
  landlord_flags:
    - [1247, 245, 48, 52]  # 右边玩家
    - [12, 661, 51, 53]    # 自己
    - [123, 243, 52, 54]   # 左边玩家

  # 聊天图标（用于判断是否进入游戏）
  chat_icon: [1302, 744, 117, 56]

# AI 决策阈值
thresholds:
  # 叫地主阈值
  bidding:
    call_landlord: 0.2      # 叫地主的最低分数
    steal_landlord_1: 0.4   # 抢地主阈值1
    steal_landlord_2: 0.5   # 抢地主阈值2

  # 加倍阈值
  doubling:
    landlord_stole_1: 0.5   # 地主（抢到的）加倍阈值
    landlord_stole_2: 0.4   # 地主（抢到的）保守阈值
    landlord_not_stole_1: 0.6  # 地主（没抢）加倍阈值
    landlord_not_stole_2: 0.5  # 地主（没抢）保守阈值
    farmer_high: 1.3        # 农民高牌力加倍
    farmer_medium: 1.1      # 农民中牌力加倍
    farmer_low: 1.2         # 农民低牌力加倍
    farmer_very_low: 1.0    # 农民极低牌力加倍

  # 明牌阈值
  show_cards: 1.5

# 模型配置
models:
  # DouZero 模型路径
  douzero:
    type: "resnet"  # 可选: "resnet", "general", "default"
    landlord: "baselines/resnet/resnet_landlord.ckpt"
    landlord_up: "baselines/resnet/resnet_landlord_up.ckpt"
    landlord_down: "baselines/resnet/resnet_landlord_down.ckpt"

  # 叫地主模型
  bidding:
    path: "weights/bid_weights.pkl"

  # 评分模型
  scoring:
    landlord: "weights/landlord_weights.pkl"
    farmer: "weights/farmer_weights.pkl"
    landlord_up: "weights/landlord_up_weights.pkl"
    landlord_down: "weights/landlord_down_weights.pkl"

# 图像识别配置
detection:
  confidence: 0.8  # 模板匹配置信度
  card_spacing: 45.6  # 手牌间距（像素）
  retry_times: 3   # 识别失败重试次数
  retry_delay: 0.1 # 重试延迟（秒）

# 动作执行配置
actions:
  click_delay: 0.05   # 点击间隔（秒）
  animation_wait: 0.3 # 动画等待时间（秒）
  verification_enabled: true  # 是否验证卡牌选择

# 日志配置
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "logs/agent.log"
  console: true
