# 自定义配置示例 - 用于不同分辨率或特殊需求

# 游戏窗口配置（适配 1920x1080 分辨率）
game:
  window_class: "UnityWndClass"
  window_title: "欢乐斗地主"
  target_resolution:
    width: 1920
    height: 1080

# 模板图片路径（可以使用不同的模板集）
templates:
  base_path: "pics"  # pics 在项目根目录
  my_cards: "m"
  other_cards: "o"
  center_cards: "c"
  bottom_cards: "z"

# 屏幕区域配置（基于 1440x810 基准，会自动缩放）
regions:
  base_resolution: [1440, 810]
  # 其他区域保持默认...

# AI 决策阈值 - 激进策略
thresholds:
  bidding:
    call_landlord: 0.15     # 更低的阈值，更激进叫地主
    steal_landlord_1: 0.35
    steal_landlord_2: 0.45

  doubling:
    landlord_stole_1: 0.45   # 更激进的加倍策略
    landlord_stole_2: 0.35
    landlord_not_stole_1: 0.55
    landlord_not_stole_2: 0.45
    farmer_high: 1.2         # 降低农民加倍阈值
    farmer_medium: 1.0
    farmer_low: 1.1
    farmer_very_low: 0.9

  show_cards: 1.3  # 降低明牌阈值

# 模型配置 - 使用 general 模型
models:
  douzero:
    type: "general"
    landlord: "baselines/general/general_landlord.ckpt"
    landlord_up: "baselines/general/general_landlord_up.ckpt"
    landlord_down: "baselines/general/general_landlord_down.ckpt"

  bidding:
    path: "weights/bid_weights.pkl"

  scoring:
    landlord: "weights/landlord_weights.pkl"
    farmer: "weights/farmer_weights.pkl"
    landlord_up: "weights/landlord_up_weights.pkl"
    landlord_down: "weights/landlord_down_weights.pkl"

# 图像识别配置 - 调整识别精度
detection:
  confidence: 0.75  # 降低置信度，提高识别率
  card_spacing: 48.0  # 调整卡牌间距
  retry_times: 5      # 增加重试次数
  retry_delay: 0.2

# 动作执行配置 - 加快执行速度
actions:
  click_delay: 0.03
  animation_wait: 0.2
  verification_enabled: false  # 禁用验证，加快速度

# 日志配置
logging:
  level: "DEBUG"  # 详细日志
  file: "logs/agent_debug.log"
  console: true
